<!DOCTYPE html>
<html lang="zh-CN">
<head>
<title>Projects</title>
<style>
html, body {
    height: 100%;
    margin: 0;
}
body {
    background-color: black;
    color: #00ff88;
    font-family: Consolas, monospace;
    font-size: 20px;
    text-align: center;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}
.box {
    border: 3px solid #00ff88;
    padding: 30px 40px;
    width: 520px;
    box-shadow: 0 0 30px #00ff88;
}
h1 {
    font-size: 38px;
    color: #00ff88;
    text-shadow: 0 0 20px #00ff88;
    margin: 0 0 10px 0;
}
.subtitle {
    font-size: 14px;
    color: #66ffbb;
    margin-bottom: 25px;
}
button {
    font-size: 18px;
    padding: 12px 40px;
    background: #00ff88;
    color: black;
    border: none;
    cursor: pointer;
    margin-top: 12px;
    width: 300px;
    font-weight: bold;
}
button:hover {
    background: #00cc66;
}
.entry {
    margin-bottom: 10px;
}
.tip {
    font-size: 12px;
    color: #66ffbb;
    margin-top: 4px;
    margin-bottom: 0;
}
</style>
</head>
<body>
<div class="box">
    <h1>PROJECTS</h1>
    <p class="subtitle">Select a project to open</p>

    <!-- 下面每个 entry 就是一个项目，以后加新项目就复制一段改名字和文件名 -->
    <div class="entry">
        <button onclick="window.open('https://qcyd8530.github.io/qcyd8530/FatalError-system.html', '_blank')">ERROR SYSTEM</button>
        <p class="tip">Error simulation collection</p>
    </div>

    <!-- 以后有新程序，就照着上面复制一段，改按钮文字和文件名 -->
</div>
</body>
</html>
