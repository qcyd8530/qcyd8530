<!DOCTYPE html>
<html lang="zh-CN">
<head>
<title>ERROR SYSTEM</title>
<style>
html, body {
    height: 100%;
    margin: 0;
}
body {
    background-color: black;
    color: red;
    font-family: Consolas, monospace;
    font-size: 22px;
    text-align: center;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}
.error-box {
    border: 3px solid red;
    padding: 30px 40px;
    width: 500px;
    box-shadow: 0 0 30px red;
}
h1 {
    font-size: 42px;
    color: red;
    text-shadow: 0 0 20px red;
    margin: 0 0 10px 0;
}
.subtitle {
    font-size: 16px;
    color: #ff6666;
    margin-bottom: 25px;
}
.subtitle-zh {
    font-size: 14px;
    color: #cc4444;
    margin-top: -18px;
    margin-bottom: 25px;
}
p {
    margin: 8px 0;
}
button {
    font-size: 18px;
    padding: 12px 40px;
    background: red;
    color: white;
    border: none;
    cursor: pointer;
    margin-top: 15px;
    width: 280px;
}
button:hover {
    background: darkred;
}
/* IE 提示文字 */
.ie-tip {
    font-size: 13px;
    color: #ff6666;
    margin-top: 6px;
    margin-bottom: 0;
}
/* 版本按钮和提示的分组 */
.entry {
    margin-bottom: 10px;
}
</style>
</head>
<body>
<div class="error-box">
    <h1>⚠ ERROR ⚠</h1>
    <p class="subtitle">Please select an error simulation to run</p>
    <p class="subtitle-zh">请选择要运行的错误模拟程序</p>

    <div class="entry">
        <button onclick="window.open('Fatal Error V1.html', '_blank')">运行 V1</button>
        <p class="ie-tip">⚠ 此版本仅支持 IE(Internet Explorer) 浏览器</p>
        <p class="ie-tip" style="color:#ff0000;font-weight:bold;">⚠ 警告：真的会重启！</p>
    </div>

    <div class="entry">
        <button onclick="window.open('Fatal Error V2.html', '_blank')">运行 V2</button>
        <p class="ie-tip">✔ 支持所有现代浏览器（和手机端浏览器）</p>
    </div>
</div>
</body>
</html>
