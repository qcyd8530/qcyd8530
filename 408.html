<!DOCTYPE html>
<html lang="en">
<head>
<title>408 Request Timeout</title>
<style>
html, body {
    height: 100%;
    margin: 0;
}
body {
    background-color: black;
    color: red;
    font-family: Consolas, monospace;
    font-size: 22px;
    text-align: center;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}
.error-box {
    border: 3px solid red;
    padding: 25px;
    width: 480px;
    box-shadow: 0 0 30px red;
}
h1 {
    font-size: 42px;
    color: red;
    text-shadow: 0 0 20px red;
    margin: 0 0 15px 0;
}
p {
    margin: 8px 0;
}
</style>
</head>
<body>
<div class="error-box">
<h1>408</h1>
<p>Request Timeout</p>
<p>The server timed out waiting for the request.</p>
<p>Please check your connection and try again.</p>
</div>
</body>
</html>
